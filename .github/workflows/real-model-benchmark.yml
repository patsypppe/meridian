name: real-model-benchmark

# Records and scores the checkout-agent suite against a REAL model, through the
# Meridian proxy, and publishes pass^k, the minimum detectable effect and the
# verdicts as an artifact. Unlike self-eval, this one spends money: it needs the
# GROQ_API_KEY or ANTHROPIC_API_KEY repository secret and is manual-only, with a hard budget cap
# enforced by the proxy.

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Which provider to measure (needs its repository secret)
        type: choice
        options: [groq, anthropic]
        default: groq
      model:
        description: Model id at the provider (e.g. llama-3.3-70b-versatile or claude-haiku-4-5-20251001)
        default: llama-3.3-70b-versatile
      trials:
        description: Trials per task (n)
        default: "10"
      k:
        description: The k in pass^k
        default: "3"
      budget_cents:
        description: Hard run budget in cents (the proxy stops spending at this)
        default: "200"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Only the chosen provider's key is exported. The proxy takes the first
      # credential it finds, so exporting both could send one provider's key to
      # the other.
      GROQ_API_KEY: ${{ inputs.provider == 'groq' && secrets.GROQ_API_KEY || '' }}
      ANTHROPIC_API_KEY: ${{ inputs.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY || '' }}
      MERIDIAN_UPSTREAM_API: ${{ inputs.provider == 'groq' && 'openai' || 'anthropic' }}
      MERIDIAN_UPSTREAM_BASE_URL: ${{ inputs.provider == 'groq' && 'https://api.groq.com/openai/v1' || 'https://api.anthropic.com' }}
      MERIDIAN_UPSTREAM_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Check the secret exists
        run: test -n "$GROQ_API_KEY$ANTHROPIC_API_KEY" || { echo "no API key secret for provider ${{ inputs.provider }}"; exit 1; }
      - name: Build images and repin the suite
        run: |
          uv run meridian snapshot build ./envs/checkout --tag checkout:dev \
            --write-ref --update-suite ./suites/checkout-agent
          uv run meridian snapshot build ./envs/proxy --tag meridian-proxy:dev --context .
      - name: Record and score against the real model
        run: |
          mkdir -p out cassettes
          uv run meridian run \
            --suite ./suites/checkout-agent \
            --n "${{ inputs.trials }}" --k "${{ inputs.k }}" \
            --proxy-mode record --live-provider \
            --cassettes ./cassettes --budget "${{ inputs.budget_cents }}" \
            --out out/result.json --html out/report.html 2>&1 | tee out/run.txt
      # Annotations are readable through the API; job logs and artifacts need a
      # browser session. Emitted so results can be pulled without one.
      - name: Annotate results
        if: always()
        run: |
          for f in out/run.txt out/result.json; do
            [ -f "$f" ] || continue
            body=$(head -c 30000 "$f" | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
            echo "::notice title=$f::$body"
          done
      - name: Summarise
        if: always()
        run: |
          {
            echo "## Real-model benchmark (${{ inputs.provider }} / ${{ inputs.model }})"
            echo
            echo "n=${{ inputs.trials }} k=${{ inputs.k }} budget=${{ inputs.budget_cents }}c"
            echo
            if [ -f out/result.json ]; then echo '```json'; cat out/result.json; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-model-benchmark
          path: |
            out/
            cassettes/
      - name: Sweep
        if: always()
        run: uv run meridian sweep
