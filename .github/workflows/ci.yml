name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: lint + types + unit (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every Python the package claims to support (requires-python in pyproject.toml).
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --python ${{ matrix.python }}
      - name: ruff lint
        run: uv run ruff check src tests benchmarks
      - name: ruff format check
        run: uv run ruff format --check src tests benchmarks
      - name: mypy --strict
        run: uv run mypy
      - name: unit tests
        run: uv run pytest -m unit

  web:
    name: web (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: type check (tsc --strict)
        run: npm run typecheck
      - name: tests (includes parity with the Python statistics)
        run: npm test
      - name: production build
        run: npm run build

  package:
    name: package (wheel installs and works outside the repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Build sdist and wheel
        run: |
          uv build
          uvx twine check --strict dist/*
      # Install into a clean environment and work from outside the checkout, so
      # nothing can quietly come from the repository instead of the package.
      - name: Install the wheel into a fresh environment
        run: |
          cd "$RUNNER_TEMP"
          uv venv --python 3.13 venv
          uv pip install --python venv/bin/python "$GITHUB_WORKSPACE"/dist/*.whl
          venv/bin/meridian version
      - name: meridian setup builds the proxy image from the installed package
        run: cd "$RUNNER_TEMP" && venv/bin/meridian setup
      - name: Import and build a benchmark task from the installed CLI
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p tasks/hello/environment tasks/hello/tests
          printf '[task]\nname = "smoke/hello"\n[agent]\ntimeout_sec = 60\n' > tasks/hello/task.toml
          echo 'Write hello to /app/out.txt' > tasks/hello/instruction.md
          printf 'FROM python:3.13-slim\nWORKDIR /app\n' > tasks/hello/environment/Dockerfile
          printf '#!/bin/bash\necho 1 > /logs/verifier/reward.txt\n' > tasks/hello/tests/test.sh
          venv/bin/meridian import-harbor tasks --out suites/smoke
          venv/bin/meridian suite build-images suites/smoke
          venv/bin/meridian suite publish suites/smoke

  integration:
    name: integration (docker)
    runs-on: ubuntu-latest
    needs: static
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
          POSTGRES_DB: meridian
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5433:5432"]
    env:
      MERIDIAN_DATABASE_URL: postgresql://meridian:meridian@localhost:5433/meridian
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      # An image ID is architecture-specific: the digest committed from an arm64
      # laptop does not exist on this amd64 runner. Rebuild and repin before
      # anything tries to start a container.
      - name: Build images and repin the suite
        run: |
          uv run meridian snapshot build ./envs/checkout --tag checkout:dev \
            --write-ref --update-suite ./suites/checkout-agent
          uv run meridian snapshot build ./envs/proxy --tag meridian-proxy:dev --context .
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: integration tests
        run: uv run pytest -m integration

  e2e:
    name: e2e (run, replay, gate)
    runs-on: ubuntu-latest
    needs: integration
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Build images and repin the suite
        run: |
          uv run meridian snapshot build ./envs/checkout --tag checkout:dev \
            --write-ref --update-suite ./suites/checkout-agent
          uv run meridian snapshot build ./envs/proxy --tag meridian-proxy:dev --context .
      # No API key anywhere in this job. Replay runs from the committed
      # cassettes, which is why CI works offline and cannot be flaky because a
      # provider was slow.
      - name: e2e tests
        run: uv run pytest -m e2e
