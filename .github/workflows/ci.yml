name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: lint + types + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff lint
        run: uv run ruff check src tests
      - name: ruff format check
        run: uv run ruff format --check src tests
      - name: mypy --strict
        run: uv run mypy
      - name: unit tests
        run: uv run pytest -m unit

  integration:
    name: integration (docker)
    runs-on: ubuntu-latest
    needs: static
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
          POSTGRES_DB: meridian
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5433:5432"]
    env:
      MERIDIAN_DATABASE_URL: postgresql://meridian:meridian@localhost:5433/meridian
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      # An image ID is architecture-specific: the digest committed from an arm64
      # laptop does not exist on this amd64 runner. Rebuild and repin before
      # anything tries to start a container.
      - name: Build images and repin the suite
        run: |
          uv run meridian snapshot build ./envs/checkout --tag checkout:dev \
            --write-ref --update-suite ./suites/checkout-agent
          uv run meridian snapshot build ./envs/proxy --tag meridian-proxy:dev --context .
      - name: integration tests
        run: uv run pytest -m integration

  e2e:
    name: e2e (run, replay, gate)
    runs-on: ubuntu-latest
    needs: integration
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Build images and repin the suite
        run: |
          uv run meridian snapshot build ./envs/checkout --tag checkout:dev \
            --write-ref --update-suite ./suites/checkout-agent
          uv run meridian snapshot build ./envs/proxy --tag meridian-proxy:dev --context .
      # No API key anywhere in this job. Replay runs from the committed
      # cassettes, which is why CI works offline and cannot be flaky because a
      # provider was slow.
      - name: e2e tests
        run: uv run pytest -m e2e
