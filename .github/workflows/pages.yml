name: showcase site

# Publishes site/ to GitHub Pages. The page is static and reads
# site/data/showcase.json, which is regenerated from real runs by
# `bash site/data/regenerate.sh` and committed — this workflow never runs
# Meridian itself, so it needs no Docker and no API key.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The explorer re-implements stats/power.py in JavaScript. Refuse to
      # publish a page whose arithmetic disagrees with the Python numbers in
      # the data file it ships with.
      - name: Check the page's arithmetic against the Python export
        run: node --test site/tests/*.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
