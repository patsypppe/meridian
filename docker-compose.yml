name: meridian

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: meridian
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - meridian-pgdata:/var/lib/postgresql/data

volumes:
  meridian-pgdata:
