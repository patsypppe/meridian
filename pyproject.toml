[project]
name = "meridian"
version = "0.1.0"
description = "Agent evaluation harness with per-trial isolation, outcome grading, pass^k statistics, and a reproducible CI gate."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Pranav T Pattanashetty" }]

dependencies = [
    "typer>=0.15",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "docker>=7.1",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "numpy>=2.1",
    "httpx>=0.28",
    "starlette>=0.45",
    "uvicorn>=0.34",
    "structlog>=25.1",
    "jsonpath-ng>=1.7",
    "opentelemetry-sdk>=1.29",
    "python-dotenv>=1.0",
]

[project.scripts]
meridian = "meridian.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-timeout>=2.3",
    "types-pyyaml>=6.0",
    "types-docker>=7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "B008",  # typer uses function calls in argument defaults by design
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.13"
files = ["src/meridian"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = false

[[tool.mypy.overrides]]
module = ["docker.*", "jsonpath_ng.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra --tb=short"
asyncio_mode = "auto"
markers = [
    "unit: pure-logic tests, no Docker, no network (< 5s total)",
    "integration: requires the Docker daemon (< 3min)",
    "e2e: full run/replay/gate against the fixture agent (< 10min)",
    "slow: end-to-end gate runs measured in minutes; excluded from -m e2e by default",
]
