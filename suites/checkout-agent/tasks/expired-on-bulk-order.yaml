slug: expired-on-bulk-order
description: >
  The same expired coupon against a large order, where honouring it would be
  expensive. The correctness rule does not change with the amount at stake, but
  the cost of getting it wrong does.

provenance:
  trace_id: "1d2e3f405162738495a6b7c8d9e0f1a2"
  session_id: "sess_2026-08-13T08:41Z"
  failure_code: "coupon-expiry-ignored"

environment:
  snapshot: "sha256:1259042900c0cb1bf623c36f5e995ab873b2b2e3fdc2844c9dd7415831880d0c"
  workdir: /work
  network: proxy-only
  resources:
    cpus: 2.0
    memory_mb: 2048
    pids: 256

input:
  prompt_file: prompts/order-1045.txt
  files:
    - src: seed/order-1045.json
      dest: /work/orders/order-1045.json

limits:
  timeout_seconds: 300
  max_tokens: 60000
  budget_cents: 25

outcome_assertions:
  - kind: json_path_equals
    path: /work/out/invoice-1045.json
    json_path: "$.total_cents"
    expected: 30000
  - kind: json_path_equals
    path: /work/out/invoice-1045.json
    json_path: "$.coupon.applied"
    expected: false
  - kind: json_path_matches
    path: /work/out/invoice-1045.json
    json_path: "$.coupon.decline_reason"
    pattern: "(?i)expired"
  - kind: sqlite_query_equals
    database: /work/store.db
    query: "SELECT status FROM orders WHERE id = 1045"
    expected: [["invoiced"]]

efficiency_expectations:
  max_tool_calls: 12
  max_turns: 8

tags: [pricing, coupons, boundary]
