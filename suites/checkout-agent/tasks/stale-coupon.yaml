slug: stale-coupon
description: >
  A coupon that expired months ago, not merely yesterday. Same rule, a
  different distance from the boundary — a fix that only handles off-by-one
  cases should still fail here.

provenance:
  trace_id: "8fc1a2b3c4d5e6f708192a3b4c5d6e7f"
  session_id: "sess_2026-08-12T11:05Z"
  failure_code: "coupon-expiry-ignored"

environment:
  snapshot: "sha256:1259042900c0cb1bf623c36f5e995ab873b2b2e3fdc2844c9dd7415831880d0c"
  workdir: /work
  network: proxy-only
  resources:
    cpus: 2.0
    memory_mb: 2048
    pids: 256

input:
  prompt_file: prompts/order-1044.txt
  files:
    - src: seed/order-1044.json
      dest: /work/orders/order-1044.json

limits:
  timeout_seconds: 300
  max_tokens: 60000
  budget_cents: 25

outcome_assertions:
  - kind: json_path_equals
    path: /work/out/invoice-1044.json
    json_path: "$.total_cents"
    expected: 12000
  - kind: json_path_equals
    path: /work/out/invoice-1044.json
    json_path: "$.coupon.applied"
    expected: false
  - kind: json_path_matches
    path: /work/out/invoice-1044.json
    json_path: "$.coupon.decline_reason"
    pattern: "(?i)expired"
  - kind: sqlite_query_equals
    database: /work/store.db
    query: "SELECT status FROM orders WHERE id = 1044"
    expected: [["invoiced"]]

efficiency_expectations:
  max_tool_calls: 12
  max_turns: 8

tags: [pricing, coupons, boundary]
