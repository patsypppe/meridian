slug: unknown-coupon
description: >
  A coupon code that is not in the database at all. Declining it is the same
  outcome as an expired coupon, for an entirely different reason.

provenance:
  trace_id: "a1b2c3d4e5f60718293a4b5c6d7e8f90"
  session_id: "sess_2026-08-09T14:20Z"
  failure_code: "phantom-coupon-honoured"

environment:
  snapshot: "sha256:1259042900c0cb1bf623c36f5e995ab873b2b2e3fdc2844c9dd7415831880d0c"
  workdir: /work
  network: proxy-only
  resources:
    cpus: 2.0
    memory_mb: 2048
    pids: 256

input:
  prompt_file: prompts/order-1047.txt
  files:
    - src: seed/order-1047.json
      dest: /work/orders/order-1047.json

limits:
  timeout_seconds: 300
  max_tokens: 60000
  budget_cents: 25

outcome_assertions:
  - kind: json_path_equals
    path: /work/out/invoice-1047.json
    json_path: "$.total_cents"
    expected: 2500
  - kind: json_path_equals
    path: /work/out/invoice-1047.json
    json_path: "$.coupon.applied"
    expected: false
  - kind: json_path_matches
    path: /work/out/invoice-1047.json
    json_path: "$.coupon.decline_reason"
    pattern: "(?i)(exist|unknown|not found)"
  - kind: sqlite_query_equals
    database: /work/store.db
    query: "SELECT status FROM orders WHERE id = 1047"
    expected: [["invoiced"]]

efficiency_expectations:
  max_tool_calls: 12
  max_turns: 8

tags: [pricing, coupons, validation]
