slug: boundary-bulk
description: >
  A coupon expiring exactly on the order date applied to five identical items; still valid on or before, and the total ends in 66 cents.

provenance:
  synthetic_reason: >
    authored to give the paired test power over rounding regressions: expiry boundary on a bulk order with a non-round-dollar total.
    The original seven tasks mostly invoice whole-dollar totals, which a
    rounding regression leaves unchanged.

environment:
  snapshot: "sha256:9167c10ab93fe8c4c1b338e9bc063a83b66edab38c74cdb0d2b74b04a6777f34"
  workdir: /work
  network: proxy-only
  resources:
    cpus: 2.0
    memory_mb: 2048
    pids: 256

input:
  prompt_file: prompts/order-1051.txt
  files:
    - src: seed/order-1051.json
      dest: /work/orders/order-1051.json

limits:
  timeout_seconds: 300
  max_tokens: 60000
  budget_cents: 25

outcome_assertions:
  - kind: json_path_equals
    path: /work/out/invoice-1051.json
    json_path: "$.total_cents"
    expected: 5166
  - kind: json_path_equals
    path: /work/out/invoice-1051.json
    json_path: "$.coupon.applied"
    expected: true
  - kind: sqlite_query_equals
    database: /work/store.db
    query: "SELECT status FROM orders WHERE id = 1051"
    expected: [["invoiced"]]

efficiency_expectations:
  max_tool_calls: 12
  max_turns: 8

tags: [pricing, coupons, rounding]
